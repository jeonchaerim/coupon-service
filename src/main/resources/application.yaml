spring:
  application:
    name: coupon
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/coupon}
    username: ${SPRING_DATASOURCE_USERNAME:coupon}
    password: ${SPRING_DATASOURCE_PASSWORD:coupon}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update  # 운영은 NONE
    open-in-view: false
    show-sql: false  # 로깅 양도 부하 테스트시 응답 latency에 영향이 있으므로 true -> false 로 변경하도록 하였음
  mvc:
    problemdetails:
      enabled: true

logging:
  level:
    com.apiece.coupon: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN